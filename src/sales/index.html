<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Sold Punks</title>
<meta name="description" content="Every CryptoPunk sold in the last 24 hours. V1 and V2, native and wrapped.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff; --ink:#111; --hair:#d8d6d1; --meta:#7a7770; --tag:#f0efeb; --accent:#c4441a;
  --v1:#66a670; --v2:#638596; --v1wrap:#8970b1; --sold:#8c5851;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --script:'Yellowtail','Brush Script MT',cursive;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.45}
a{color:inherit;text-decoration-color:var(--hair);text-underline-offset:2px}
a:hover{text-decoration-color:currentColor}
.wrap{max-width:760px;margin:0 auto;padding:36px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
h1{margin:0;font-family:var(--script);font-weight:400;font-size:76px;line-height:1;color:var(--sold);transform:rotate(-4deg);transform-origin:left bottom;padding:4px 0 2px}
h1 span{display:inline-block;margin-left:.18em}
.updated{font:400 12px var(--mono);color:var(--meta);padding-bottom:4px}
.lede{color:#333;font-size:15px;margin:16px 0 22px;max-width:58ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--hair);margin:0 0 6px}
.stats div{padding:12px 14px;border-right:1px solid var(--hair)}
.stats div:last-child{border-right:0}
.stats b{display:block;font:500 20px var(--mono)}
.stats span{font-size:12px;color:var(--meta)}
ol.feed{list-style:none;margin:0;padding:0}
.sale{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--hair)}
.thumb{width:72px;height:72px;image-rendering:pixelated;display:block;background:var(--tag)}
.who{min-width:0}
.id{font-weight:700;font-size:18px;line-height:1.7}
.id a{text-decoration:none}
.chip{display:inline-block;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;margin-left:6px;vertical-align:3px;color:#fff}
.chip.v1{background:var(--v1)} .chip.v2{background:var(--v2)}
.chip.wrap{background:var(--tag);color:var(--meta)}
.chip.wrap.v1w{background:var(--v1wrap);color:#fff}
.venue{font:400 12px var(--mono);color:var(--meta)}
.parties{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.parties a{font-family:var(--mono);font-size:13px}
.note{font-size:13px;color:#444;margin-top:2px}
.price{text-align:right;white-space:nowrap}
.price b{display:block;font:500 19px var(--mono)}
.price span,.price a{font:400 12px var(--mono);color:var(--meta)}
.price a{display:block;margin-top:2px}
.empty{padding:48px 0;text-align:center;color:var(--meta);font:400 14px var(--mono);border-bottom:1px solid var(--hair)}
.error{color:var(--accent)}
footer{margin-top:28px;font-size:12px;color:var(--meta);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ppp img{display:block;image-rendering:pixelated}
@media (max-width:560px){
  h1{font-size:58px}
  .sale{grid-template-columns:56px 1fr;gap:12px}
  .thumb{width:56px;height:56px}
  .price{grid-column:2;text-align:left;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .price b{display:inline;font-size:17px}
  .price a{display:inline;margin:0}
  .stats b{font-size:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sold<span>Punks</span></h1>
    <div class="updated" id="updated">Loading</div>
  </header>
  <p class="lede">Every CryptoPunk sold in the last 24 hours. Native &amp; Wrapped</p>

  <div class="stats">
    <div><b id="s-count">-</b><span id="s-count-l">sales in 24 hours</span></div>
    <div><b id="s-vol">-</b><span>total volume</span></div>
    <div><b id="s-split">-</b><span>V1 / V2</span></div>
  </div>

  <ol class="feed" id="feed"></ol>

  <footer>
    <div>Sales data from the <a href="https://indexer.punksmarket.app">Punks Market indexer</a> and OpenSea transactions on chain.</div>
    <a class="ppp" href="https://punkspunkspunks.com" title="PunksPunksPunks"><img src="/images/logos/punkspunkspunks-logo.svg" alt="PunksPunksPunks" width="44" height="23"></a>
  </footer>
</div>

<script type="module">
import { loadSales, eth, span } from "/sales/sales.js";

const params = new URLSearchParams(location.search);
const HOURS = Number(params.get("hours")) || 24;
const IMG = "https://www.cryptopunks.app/api/punks/";
let SALES = [];

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (a) => a.slice(0, 6) + "..." + a.slice(-4);
const who = (addr, name) => `<a href="https://evm.now/address/${esc(addr)}" target="_blank" rel="noopener">${esc(name || short(addr))}</a>`;
const windowLabel = HOURS === 24 ? "24 hours" : HOURS % 24 === 0 ? `${HOURS / 24} days` : `${HOURS} hours`;
document.getElementById("s-count-l").textContent = `sales in ${windowLabel}`;

function render() {
  const feed = document.getElementById("feed");
  if (!SALES.length) {
    feed.innerHTML = `<li class="empty">No punks sold in the last ${windowLabel}.</li>`;
    return;
  }
  feed.innerHTML = SALES.map((s) => {
    const usd = s.usdCents ? "$" + Math.round(s.usdCents / 100).toLocaleString() : "";
    const via = [s.venue, s.via].filter(Boolean).join(", ");
    const bundle = s.bundle ? `, bundle of ${s.bundle} (total price)` : "";
    return `
    <li class="sale">
      <a href="https://punkfinder.com/${s.punk}" target="_blank" rel="noopener"><img class="thumb" src="${IMG}${s.punk}/image?transparent=true&bg=f0efeb" alt="CryptoPunk #${s.punk}" width="72" height="72" loading="lazy"></a>
      <div class="who">
        <div class="id"><a href="https://punkfinder.com/${s.punk}" target="_blank" rel="noopener">#${s.punk}</a><span class="chip ${s.version.toLowerCase()}">${s.version}</span>${s.wrapper ? `<span class="chip wrap${s.version === "V1" ? " v1w" : ""}">${esc(s.wrapper)}</span>` : ""}</div>
        <div class="venue">${esc(via)}${bundle}</div>
        <div class="parties">Sold by ${who(s.seller, s.sellerName)} to ${who(s.buyer, s.buyerName)}</div>
        ${s.note ? `<div class="note">${esc(s.note[0].toUpperCase() + s.note.slice(1))}.</div>` : ""}
      </div>
      <div class="price"><b>${eth(s.wei)} ${s.currency === "WETH" ? "WETH" : "ETH"}</b><span>${usd}</span><a href="https://evm.now/tx/${esc(s.tx)}" target="_blank" rel="noopener">${span(Date.now() / 1000 - s.ts)} ago</a></div>
    </li>`;
  }).join("");
}

function stats() {
  const total = SALES.reduce((a, s) => a + s.wei, 0n);
  document.getElementById("s-count").textContent = SALES.length;
  document.getElementById("s-vol").textContent = `${eth(total)} ETH`;
  const v1 = SALES.filter((s) => s.version === "V1").length;
  document.getElementById("s-split").textContent = `${v1} / ${SALES.length - v1}`;
}

async function refresh() {
  const el = document.getElementById("updated");
  try {
    SALES = await loadSales({ hours: HOURS });
    stats();
    render();
    el.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
  } catch (e) {
    el.innerHTML = `<span class="error">Update failed: ${esc(e.message)}</span>`;
  }
}

refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
